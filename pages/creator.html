<!--creator.html-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree creator</title>
    <link rel="stylesheet" href="../styles/creator.css">
</head>

<body>
    <header>
        <h1>Vamos criar a sua pagina</h1>
    </header>

    <main>
        <div class="backgroundSelection">
            <label for="backgroundType">Tipo de fundo</label>
            <select name="backgroundType" id="backgroundType">
                <option value="color">Cor</option>
                <option value="image">Imagem</option>
            </select>
            <div id="color-background">
                <label for="backgroundColor">Escolha uma cor</label>
                <input type="color" id="backgroundColor" value="#ffffff">
            </div>
            <div id="image-background" hidden>
                <label for="backgroundImage">Escolha uma imagem</label>
                <input type="file" id="backgroundImage" accept="image/*">
            </div>
        </div>
        <div class="profilePhoto">
            <div class="photo-preview-wrapper">
                <img id="photo-preview" src="../imgs/usuario.png" alt="Foto de perfil" width="96" height="96">
                <label for="profilePhoto" class="photo-upload-label" title="Alterar foto">
                    <span aria-hidden="true">📷</span>
                    <span class="visually-hidden">Escolher foto de perfil</span>
                </label>
            </div>
            <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" class="visually-hidden">
            <button type="button" id="remove-photo" hidden>Remover foto</button>
        </div>
        <div class="Titleanssubtitles">
            <input type="text" name="title" id="title" placeholder="Seu nome">
            <input type="text" name="subtitle" id="subtitle" placeholder="Sua bio">
        </div>
        <div class="links">
            <div id="links-wrapper">
                <input type="url" name="links[]" placeholder="https://exemplo.com">
            </div>
            <button type="button" id="add-link">+ Adicionar link</button>
        </div>
        <div class="create">
            <button type="button"  id="create">crie sua pagina!</button>
        </div>
    </main>

    <script src="../js/creator.js"></script>
</body>

</html>
